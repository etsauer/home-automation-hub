---
# CHECK-MODE ONLY against the Pi inventory.
# This will not write files when check_mode is active.
#
#   ansible-playbook -i ansible/hosts ansible/dry-run.yml --check --diff
#   ansible-playbook -i ansible/hosts ansible/dry-run.yml --tags caddy --check --diff
- name: Check-mode dry-run against the Raspberry Pi
  hosts: pi
  become: true
  gather_facts: true
  check_mode: true
  pre_tasks:
    - name: Refuse to run unless Ansible check mode is active
      tags: always
      ansible.builtin.assert:
        that:
          - ansible_check_mode | bool
        fail_msg: >-
          dry-run.yml is check-mode only and refuses real changes.
          Use site.yml deliberately if you intend to modify the Pi
          (optionally --tags <role> for one service).
  roles:
    - role: podman
      tags: [podman]
    - role: caddy
      tags: [caddy]
    - role: godaddy_ddns
      tags: [godaddy_ddns]
    - role: mosquitto
      tags: [mosquitto]
    - role: homeassistant
      tags: [homeassistant]
    - role: frigate
      tags: [frigate]
    - role: coffee_site
      tags: [coffee_site]
