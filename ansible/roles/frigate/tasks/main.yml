---
- name: Validate Frigate configuration values
  ansible.builtin.assert:
    that:
      - frigate_image is defined
      - frigate_image | length > 0
      - frigate_config_dir is defined
      - frigate_media_dir is defined
      - frigate_rtsp_password is defined
      - frigate_rtsp_password | length > 0
      - frigate_rtsp_password != "REPLACE_ME"
      - frigate_rtsp_password != "REDACT_ME"
    fail_msg: >-
      Set frigate_rtsp_password (not REPLACE_ME/REDACT_ME) in
      group_vars/all/secrets.yml before deploying frigate.

- name: Validate Frigate storage monitor secrets
  when: frigate_manage_storage_monitor | bool
  ansible.builtin.assert:
    that:
      - ha_url is defined
      - ha_url | length > 0
      - ha_url != "REPLACE_ME"
      - ha_notify_service is defined
      - ha_notify_service | length > 0
      - ha_notify_service != "REPLACE_ME"
      - ha_bearer_token is defined
      - ha_bearer_token | length > 0
      - ha_bearer_token != "REPLACE_ME"
    fail_msg: >-
      Set ha_url, ha_notify_service, and ha_bearer_token in
      group_vars/all/secrets.yml for the Frigate storage monitor.

- name: Ensure Frigate config directory exists
  ansible.builtin.file:
    path: "{{ frigate_config_dir }}"
    state: directory
    owner: "{{ frigate_owner }}"
    group: "{{ frigate_group }}"
    mode: "0755"

- name: Ensure Frigate media directory exists
  # Do not force owner/group — /mnt/lacie/frigate_media is shared storage.
  ansible.builtin.file:
    path: "{{ frigate_media_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Frigate systemd directory exists
  ansible.builtin.file:
    path: "{{ frigate_systemd_dir }}"
    state: directory
    owner: "{{ frigate_owner }}"
    group: "{{ frigate_group }}"
    mode: "0755"

- name: Require recovered Frigate config.yaml (do not overwrite)
  ansible.builtin.stat:
    path: "{{ frigate_config_file }}"
  register: frigate_config_stat

- name: Assert config.yaml is present and non-empty
  ansible.builtin.assert:
    that:
      - frigate_config_stat.stat.exists
      - frigate_config_stat.stat.isreg
      - frigate_config_stat.stat.size | int > 0
    fail_msg: >-
      {{ frigate_config_file }} is missing or empty.
      Restore the live Frigate config before deploying this role.
      This role intentionally does not write config.yaml.

- name: Require accelerator and media path on the Pi
  when: not frigate_rehearsal_mode | bool
  block:
    - name: Stat Hailo device
      ansible.builtin.stat:
        path: "{{ frigate_hailo_device }}"
      register: frigate_hailo_stat

    - name: Assert Hailo device exists
      ansible.builtin.assert:
        that:
          - frigate_hailo_stat.stat.exists
        fail_msg: >-
          {{ frigate_hailo_device }} is missing. Frigate cutover requires the
          Hailo accelerator device present on the host.

- name: Deploy frigate container systemd unit
  ansible.builtin.template:
    src: frigate.container.j2
    dest: "{{ frigate_systemd_dir }}/frigate.container"
    owner: "{{ frigate_owner }}"
    group: "{{ frigate_group }}"
    mode: "0644"
    backup: true
  notify: Restart frigate

- name: Apply notified frigate service changes
  when:
    - not ansible_check_mode
    - not frigate_rehearsal_mode | bool
    - frigate_manage_service | bool
  ansible.builtin.meta: flush_handlers

- name: Deploy Frigate storage monitor
  when: frigate_manage_storage_monitor | bool
  block:
    - name: Deploy storage monitor script
      ansible.builtin.template:
        src: frigate-storage-monitor.sh.j2
        dest: "{{ frigate_monitor_script_path }}"
        owner: "{{ frigate_owner }}"
        group: "{{ frigate_group }}"
        mode: "0755"
        backup: true

    - name: Deploy storage monitor environment file
      ansible.builtin.template:
        src: frigate-monitor.env.j2
        dest: "{{ frigate_monitor_env_path }}"
        owner: "{{ frigate_owner }}"
        group: "{{ frigate_group }}"
        mode: "0600"
        backup: true

    - name: Ensure storage monitor log file exists
      ansible.builtin.file:
        path: "{{ frigate_monitor_log_path }}"
        state: touch
        owner: "{{ frigate_owner }}"
        group: "{{ frigate_group }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Remove unmanaged frigate storage monitor cron lines
      when:
        - not frigate_rehearsal_mode | bool
        - not ansible_check_mode
      ansible.builtin.shell: |
        set -euo pipefail
        tmp="$(mktemp)"
        if crontab -l 2>/dev/null | grep -q 'frigate-storage-monitor\.sh'; then
          crontab -l 2>/dev/null | grep -v 'frigate-storage-monitor\.sh' >"$tmp" || true
          crontab "$tmp"
          echo changed
        else
          echo unchanged
        fi
        rm -f "$tmp"
      args:
        executable: /bin/bash
      register: frigate_cron_cleanup
      changed_when: "'changed' in frigate_cron_cleanup.stdout"

    - name: Install storage monitor cron job
      when: not frigate_rehearsal_mode | bool
      ansible.builtin.cron:
        name: frigate storage monitor
        user: root
        minute: "{{ frigate_monitor_cron_minute }}"
        job: "{{ frigate_monitor_script_path }} >/dev/null 2>&1"
        state: present
