---
- name: Validate Caddy sites
  ansible.builtin.assert:
    that:
      - caddy_sites is defined
      - caddy_sites | length > 0
    fail_msg: >-
      Define caddy_sites as a non-empty list before deploying Caddy.

- name: Validate each Caddy site entry
  ansible.builtin.assert:
    that:
      - item.names is defined
      - item.names | length > 0
      - "'example.com' not in item.names"
      - (item.upstream | default('') | length > 0) or (item.redir | default('') | length > 0)
      - not ((item.upstream | default('') | length > 0) and (item.redir | default('') | length > 0))
    fail_msg: >-
      Each caddy_sites entry needs names plus exactly one of upstream or redir
      (not example.com).
  loop: "{{ caddy_sites }}"
  loop_control:
    label: "{{ item.names | join(',') }}"

- name: Keep the Home Assistant vhost in the Caddyfile
  ansible.builtin.assert:
    that:
      - "'hass.mre.coffee' in (caddy_sites | map(attribute='names') | flatten)"
    fail_msg: >-
      caddy_sites must include hass.mre.coffee or Home Assistant TLS will drop.

- name: Ensure caddy config dir exists
  ansible.builtin.file:
    path: "{{ caddy_config_dir }}"
    state: directory
    owner: "{{ caddy_owner }}"
    group: "{{ caddy_group }}"
    mode: "0755"

- name: Ensure caddy systemd directory exists
  ansible.builtin.file:
    path: "{{ caddy_systemd_dir }}"
    state: directory
    owner: "{{ caddy_owner }}"
    group: "{{ caddy_group }}"
    mode: "0755"

- name: Deploy Caddyfile template
  ansible.builtin.template:
    src: caddy.Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    owner: "{{ caddy_owner }}"
    group: "{{ caddy_group }}"
    mode: "0644"
    backup: true

- name: Deploy container systemd unit (container file)
  ansible.builtin.template:
    src: caddy.container.j2
    dest: "{{ caddy_systemd_dir }}/caddy.container"
    owner: "{{ caddy_owner }}"
    group: "{{ caddy_group }}"
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd changes for Caddy
  when:
    - not ansible_check_mode
    - not caddy_rehearsal_mode | bool
    - caddy_manage_service | bool
  block:
    - name: Flush handlers so Quadlet can regenerate caddy.service
      ansible.builtin.meta: flush_handlers

    - name: Enable and start caddy.service
      ansible.builtin.systemd:
        name: caddy.service
        enabled: true
        state: started
        daemon_reload: true
