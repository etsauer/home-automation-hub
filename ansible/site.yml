---
# Steady-state entrypoint for the home automation hub.
# Only enable roles that have been validated against the live Pi.
# Unrecovered services stay commented until their fix-* cutover is done.
- name: Configure Raspberry Pi hosts
  hosts: pi
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all/secrets.yml
  pre_tasks:
    - name: Ensure secrets required by enabled roles are defined
      ansible.builtin.assert:
        that:
          - gd_key is defined
          - gd_key | length > 0
          - gd_key != "REPLACE_ME"
          - gd_secret is defined
          - gd_secret | length > 0
          - gd_secret != "REPLACE_ME"
          - frigate_rtsp_password is defined
          - frigate_rtsp_password | length > 0
          - frigate_rtsp_password != "REPLACE_ME"
          - frigate_rtsp_password != "REDACT_ME"
          - ha_url is defined
          - ha_url | length > 0
          - ha_url != "REPLACE_ME"
          - ha_notify_service is defined
          - ha_notify_service | length > 0
          - ha_notify_service != "REPLACE_ME"
          - ha_bearer_token is defined
          - ha_bearer_token | length > 0
          - ha_bearer_token != "REPLACE_ME"
        fail_msg: >-
          Define gd_key, gd_secret, frigate_rtsp_password, ha_url,
          ha_notify_service, and ha_bearer_token in group_vars/all/secrets.yml
          before running site.yml.
  roles:
    # Runtime prerequisite (package only — no podman.socket)
    - role: podman

    # Validated / enabled application services
    - role: caddy
      vars:
        caddy_manage_service: true
    - role: godaddy_ddns
      vars:
        gd_manage_service: true
    - role: mosquitto
      vars:
        mosq_manage_service: true
    - role: homeassistant
      vars:
        ha_manage_service: true
    - role: frigate
      vars:
        frigate_manage_service: true
