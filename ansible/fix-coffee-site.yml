---
# Deploy the mre.coffee Quadlet only.
# Default is write-only: updates coffee-site.container with backups,
# and does NOT daemon-reload, enable, or restart the service.
#
# After reviewing the files on the Pi, cut over with:
#   ansible-playbook -i ansible/hosts ansible/fix-coffee-site.yml -e coffee_site_manage_service=true
#
# Preview first:
#   ansible-playbook -i ansible/hosts ansible/fix-coffee-site.yml --check --diff
- name: Fix coffee-site on the Pi (write-only by default)
  hosts: pi
  become: true
  gather_facts: true
  vars:
    coffee_site_manage_service: false
  roles:
    - role: coffee_site
